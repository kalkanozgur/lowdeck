[package]
name = "lowdeck-agent"
description = "LowDeck PC sunucusu: Core Audio + SMTC, kullanıcı oturumunda (ADR-0002)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
lowdeck-proto = { path = "../../crates/lowdeck-proto" }

# Core Audio (COM) ve SMTC (WinRT) windows-sys'te yok. Ölçüm: deneme exe'si 136 KB (opt "s", LTO).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Media_Control",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell_PropertiesSystem",
] }
# #[implement] makrosu bu crate'i doğrudan ister; windows zaten çekiyor, ek maliyet yok.
windows-core = "0.62"
