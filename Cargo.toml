[workspace]
resolver = "2"
members = [
    "crates/lowdeck-proto",
    "crates/lowdeck-client",
    "apps/lowdeck-phone",
    "tools/mock-server",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }
slint = "1.17"
slint-build = "1.17"

# Telefon için boyut/tüketim odaklı release profili
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
