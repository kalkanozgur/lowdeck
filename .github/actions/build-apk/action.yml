name: build-apk
description: Android araç zinciri kur (cargo-ndk + aapt2/apksigner), lowdeck-phone release APK'sını derle ve imzala
inputs:
  keystore_b64:
    description: base64 release keystore (boşsa geçici keystore üretilir)
    required: false
    default: ""
  keystore_password:
    description: keystore şifresi
    required: false
    default: ""
outputs:
  apk:
    description: üretilen APK yolu
    value: ${{ steps.find.outputs.apk }}

runs:
  using: composite
  steps:
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"

    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android

    - uses: Swatinem/rust-cache@v2
      with:
        key: android

    - name: Android SDK paketleri (platform 34, build-tools, NDK r27c)
      shell: bash
      run: |
        SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
        yes | "$SDKM" --licenses > /dev/null || true
        "$SDKM" --install "platforms;android-34" "build-tools;34.0.0" "ndk;27.2.12479018" > /dev/null
        echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
        echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-ndk

    - name: Keystore
      shell: bash
      env:
        KS_B64: ${{ inputs.keystore_b64 }}
        KS_PASS: ${{ inputs.keystore_password }}
      run: |
        KS="$RUNNER_TEMP/lowdeck.keystore"
        if [ -n "$KS_B64" ]; then
          echo "$KS_B64" | base64 -d > "$KS"
          PASS="$KS_PASS"
          echo "::notice::Kalıcı release keystore ile imzalanıyor"
        else
          PASS="ci-throwaway"
          keytool -genkeypair -keystore "$KS" -storepass "$PASS" -keypass "$PASS" \
            -alias lowdeck -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=LowDeck CI" > /dev/null
          echo "::warning::Geçici keystore: bu APK önceki kurulumun üstüne yüklenemez (önce kaldır)"
        fi
        echo "KS=$KS" >> "$GITHUB_ENV"
        echo "::add-mask::$PASS"
        echo "KS_PASS=$PASS" >> "$GITHUB_ENV"

    - name: APK derle (cargo-ndk + aapt2 + apksigner)
      id: find
      shell: bash
      run: |
        APK=target/apk/lowdeck-phone.apk
        OUT="$APK" bash scripts/build-apk.sh
        ls -la "$APK"
        echo "apk=$APK" >> "$GITHUB_OUTPUT"
        echo "### APK: $(du -h "$APK" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
