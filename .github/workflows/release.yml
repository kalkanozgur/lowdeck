# v* tag'i push edilince imzalı APK derlenip GitHub Release'e eklenir. Telefon APK'yı
# doğrudan Release sayfasından indirip kurar. PC exe'leri (agent + masaüstü) zip olarak
# aynı Release'e eklenir (ADR-0004).
# Onay = tag push'un kendisi: private + GitHub Free'de environment reviewer yok.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sürüm tutarlılığı (tag == Cargo.toml version)
        run: |
          CARGO_VER=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          TAG_VER="${GITHUB_REF_NAME#v}"
          [ "$CARGO_VER" = "$TAG_VER" ] || { echo "::error::tag $TAG_VER != Cargo.toml $CARGO_VER"; exit 1; }

      - name: Keystore secret'ı var mı
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          [ -n "$KS" ] || { echo "::error::ANDROID_KEYSTORE_B64 secret'ı tanımlı değil"; exit 1; }

      - id: build
        uses: ./.github/actions/build-apk
        with:
          keystore_b64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          keystore_password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OUT="lowdeck-${GITHUB_REF_NAME}.apk"
          cp "${{ steps.build.outputs.apk }}" "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          gh release create "$GITHUB_REF_NAME" "$OUT" "$OUT.sha256" --generate-notes --title "LowDeck $GITHUB_REF_NAME"

  # PC: lowdeck-agent.exe + lowdeck-desktop.exe aynı klasörde çalışır (ADR-0004); Release'i yukarıdaki job açar.
  pc:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p lowdeck-agent -p lowdeck-desktop
      - name: Zip + sha256 → Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $dir = "lowdeck-pc"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item target/release/lowdeck-agent.exe, target/release/lowdeck-desktop.exe $dir
          @(
            "LowDeck PC $tag",
            "",
            "1. Bu klasördeki iki exe'yi %LOCALAPPDATA%\LowDeck\ içine kopyalayın (ikisi aynı klasörde olmalı).",
            "2. lowdeck-agent.exe'yi bir kez çalıştırın; tray ikonu > 'Windows ile başlat'.",
            "3. Telefon ayarı: tray ikonu > ilk satır (host/port/token). PC arayüzü: LowMonitor tray > 'Arayüzü aç'."
          ) | Set-Content -Encoding utf8 "$dir/KURULUM.txt"
          $zip = "lowdeck-pc-$tag.zip"
          Compress-Archive -Path "$dir/*" -DestinationPath $zip
          $h = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          "$h  $zip" | Set-Content -Encoding ascii -NoNewline "$zip.sha256"
          gh release upload $tag $zip "$zip.sha256"
