[package]
name = "lowdeck-desktop"
description = "LowMonitor PC arayüzü (Slint): Canlı + Olaylar, veri lowdeck-agent loopback'ten (ADR-0003)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
lowdeck-proto = { path = "../../crates/lowdeck-proto" }
lowdeck-client = { path = "../../crates/lowdeck-client" }
slint.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build.workspace = true
