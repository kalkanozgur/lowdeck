[package]
name = "lowdeck-desktop"
description = "LowMonitor PC arayüzü (Slint): Canlı + Olaylar, veri lowdeck-agent loopback'ten (ADR-0003)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
lowdeck-proto = { path = "../../crates/lowdeck-proto" }
lowdeck-client = { path = "../../crates/lowdeck-client" }
# winit olayları: küçültmede metrik aboneliğini düşürmek için (polling yok)
# Varsayılan özellikler kapalı: yalnız femtovg renderer (software renderer, erişilebilirlik, system-tray yok).
# Windows release 8,60 → 7,85 MiB (mingw ölçümü 2026-11-15). Kalan ~3,8 MiB .rdata Slint metin yığını
# (parley complex-scripts + ICU segmenter), Slint'te kapatılamıyor. Sürüm workspace ile aynı tutulur.
slint = { version = "1.17", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "software-renderer-path", "unstable-winit-030"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Wdk_System_SystemInformation",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build.workspace = true
