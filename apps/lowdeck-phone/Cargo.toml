[package]
name = "lowdeck-phone"
description = "LowDeck telefon istemcisi (Slint). Aynı kod Android'de ve masaüstünde (geliştirme) çalışır."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# cdylib: Android (.so -> APK), rlib: masaüstü bin'i için
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "lowdeck-phone-dev"
path = "src/main.rs"

[dependencies]
lowdeck-proto = { path = "../../crates/lowdeck-proto" }
lowdeck-client = { path = "../../crates/lowdeck-client" }
# Bu feature her hedefte derlenir; Android dışında etkisizdir (Slint dokümanı).
slint = { workspace = true, features = ["backend-android-activity-06"] }

# Yerel saat farkı (Olaylar/Geçmiş saatleri); zaten Slint/std bağımlılığı olarak derleniyor, ek boyut yok.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# ADR-0011: DeckService (Java) çağrıları. 0.21 android-activity üzerinden zaten derleniyor: yeni crate yok.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[build-dependencies]
slint-build.workspace = true
