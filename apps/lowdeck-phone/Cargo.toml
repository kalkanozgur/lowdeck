[package]
name = "lowdeck-phone"
description = "LowDeck telefon istemcisi (Slint). Aynı kod Android'de ve masaüstünde (geliştirme) çalışır."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# cdylib: Android (.so -> APK), rlib: masaüstü bin'i için
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "lowdeck-desktop"
path = "src/main.rs"

[dependencies]
lowdeck-proto = { path = "../../crates/lowdeck-proto" }
lowdeck-client = { path = "../../crates/lowdeck-client" }
# Bu feature her hedefte derlenir; Android dışında etkisizdir (Slint dokümanı).
slint = { version = "1.17", features = ["backend-android-activity-06"] }

[build-dependencies]
slint-build.workspace = true

# ---- cargo-apk ----
# Not: Slint'in güncel rehberi xbuild'i de gösteriyor; Faz 0'da Windows'ta
# hangisi sorunsuz çalışıyorsa o seçilir ve bu blok ona göre güncellenir.
[package.metadata.android]
package = "dev.kalkan.lowdeck"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 29     # Android 10 (toco stok MIUI tabanı)
target_sdk_version = 34

[package.metadata.android.application]
label = "LowDeck"

[package.metadata.android.application.activity]
orientation = "portrait"

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"
